site_name: DeutschlandSMP Wiki
site_url: https://wiki.desmp.de
site_description: Offizielles Wiki für DeutschlandSMP.de
site_author: DeutschlandSMP.de

theme:
  name: material
  language: de
  logo: assets/images/desmp-logo.png
  favicon: assets/images/desmp-logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: amber
    accent: yellow

extra_css:
  - stylesheets/desmp-theme-v3.css

copyright: '<span class="footer-credit">Made with <a href="https://squidfunk.github.io/mkdocs-material/">Material for MkDocs</a></span><a class="footer-legal" href="https://shop.deutschlandsmp.de/spielbedingungen-rechtliches">Impressum</a>'

extra:
  generator: false

nav:
  - Startseite: index.md
  - Erste Schritte:
      - Server beitreten: erste-schritte/server-beitreten.md
      - Java Edition: erste-schritte/java.md
      - Bedrock Edition: erste-schritte/bedrock.md
      - PlayStation & Xbox: erste-schritte/konsole.md
  - Spielsysteme:
      - Coins: systeme/coins.md
      - Farmboxen: systeme/farmbox.md
      - Fortschritt & Tageslimit: systeme/progression.md
      - Lands & Grundstücksschutz: systeme/lands.md
      - Sicher handeln: systeme/trade.md
      - Dönerladen: systeme/doenerladen.md
      - Standort & Karte: systeme/wobinich.md
  - Befehle: befehle.md
  - Ränge: raenge.md
  - Regeln: regeln.md
  - FAQ: faq.md
  - Discord: https://discord.desmp.de
  - LiveMap: https://map.deutschlandsmp.de/
  - Shop: https://shop.deutschlandsmp.de/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
